<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IL CAFETO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: linear-gradient(135deg, #382a19 0%, #5a4a2f 100%);
      color: #0f0f0f;
    }

    .logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
      border-radius: 50%;
    }

    h1, h2 {
      text-align: center;
      font-weight: 600;
    }

    input[type="number"] {
      width: 50px;
    }

    #productos, #carrito {
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #020202;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #382a19;
      color: white;
    }

    .hidden {
      display: none;
    }

    .filtros {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filtros select, .filtros input {
      padding: 5px;
    }

    button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      margin: 5px;
    }

    button:hover {
      background-color: #1976D2;
    }

    input[type="number"],
    input[type="text"],
    select {
      padding: 4px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #totalCarrito {
      font-weight: bold;
      font-size: 16px;
      text-align: right;
    }

    #factura {
      margin-top: 20px;
      background-color: #fafafa;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #factura h2 {
      text-align: center;
    }

    #factura table {
      margin-top: 10px;
    }

    /* Modal de previsualización */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 300px;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: black;
    }

    .modal-actions {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    /* Estilos para impresión en rollo de papel (80mm) */
    @media print {
      body * {
        visibility: hidden;
      }

      #facturaPreview * {
         font-weight: bold !important;
        }
      .modal, .modal * {
        visibility: visible;
      }
      .modal {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
      }
      .modal-content {
        margin: 0;
        padding: 5mm;
        border: none;
        box-shadow: none;
        width: 80mm;
        max-width: 80mm;
        font-size: 15px !important;
      }
      .modal-actions, .close {
        display: none;
      }
      #facturaPreview table {
        width: 100% !important;
        font-size: 14px !important;
      }
      #facturaPreview th, #facturaPreview td {
        padding: 3px !important;
        font-size: 10px !important;
      }
      #facturaPreview .factura-title {
        font-size: 16px !important;
        margin: 3mm 0 !important;
      }
      #facturaPreview .factura-header div {
        margin: 1mm 0 !important;
        font-size: 11px !important;
      }
      @page {
        size: 80mm 210mm;
        margin: 0;
      }
    }

    /* Estilo específico para la previsualización */
    #facturaPreview {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      width: 100%;
    }
    
    #facturaPreview .factura-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 5px;
    }
    
    #facturaPreview .factura-title {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin: 5px 0;
    }
    
    #facturaPreview table {
      width: 100%;
      border-collapse: collapse;
      margin: 5px 0;
    }
    
    #facturaPreview th, #facturaPreview td {
      border: 1px solid #000;
      padding: 3px;
      text-align: center;
    }
    
    #facturaPreview tfoot td {
      font-weight: bold;
    }
    
    #facturaPreview .factura-footer {
      text-align: center;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>

<body>

  <h2>Carrito</h2>

          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Subtotal</th>
          <th></th>
        </tr>

      <tfoot>

          <td colspan="3"><strong>Total</strong></td>

      </tfoot>
    </table>
  </div>

  <label for="mesa">Número de Mesa:</label>
  <input type="number" id="mesa" min="1" required>
  
  <div style="margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center;">
    <button onclick="generarFactura()">Generar Factura</button>
    <button onclick="vaciarCarrito()">Vaciar Carrito</button>
    <button class="exportar-btn" onclick="exportarFacturasCSV()">Exportar Facturas a CSV</button>
    <button onclick="mostrarPrevisualizacion()">Previsualizar Factura</button>
    <button onclick="borrarHistorial()">Borrar Historial</button>
  </div>

  <div id="factura" class="hidden">
    <div class="factura-header">
      <div><strong>Folio:</strong> <span id="facturaFolio"></span></div>
      <div><strong>Mesa:</strong> <span id="facturaMesa"></span></div>
      <div><strong>Fecha:</strong> <span id="facturaFecha"></span></div>
    </div>
    <h2 class="factura-title">Factura - IL CAFETO</h2>
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="facturaDetalle"></tbody>
      <tfoot>
        <tr>
          <td colspan="3"><strong>Total a Pagar</strong></td>
          <td id="facturaTotal"></td>
        </tr>
      </tfoot>
    </table>
    <div class="factura-footer">
      ¡Vuelve pronto! 😉
    </div>
    <br>
  </div>

  <!-- Modal para previsualización -->
  <div id="previewModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <div id="facturaPreview"></div>
      <div class="modal-actions">
        <button onclick="imprimirFactura()">Imprimir</button>
        <button onclick="exportarPDF()">Exportar a PDF</button>

    ];

    const carrito = [];
    let folio = parseInt(localStorage.getItem('folio') || '1');

    function guardarFacturaEnHistorial(factura) {
      let historial = JSON.parse(localStorage.getItem('historialFacturas') || '[]');
      historial.push(factura);
      localStorage.setItem('historialFacturas', JSON.stringify(historial));
    }

    function mostrarProductos() {
      const contenedor = document.getElementById('listaProductos');
      contenedor.innerHTML = '';
      productos.forEach((p, i) => {
        contenedor.innerHTML += `
          <tr class="producto" data-nombre="${p.nombre.toLowerCase()}" data-categoria="${p.categoria}">
            <td>${p.nombre}</td>
            <td>${p.precio.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
            <td><input type="number" min="1" step="any" value="1" id="cantidad-${i}"></td>
            <td><button onclick="agregarAlCarrito(${i})">Agregar</button></td>
          </tr>`;
      });
    }

    function filtrarProductos() {
      const filtroTexto = document.getElementById('buscador').value.toLowerCase();
      const filtroCategoria = document.getElementById('categoriaFiltro').value;
      document.querySelectorAll('.producto').forEach(row => {
        const nombre = row.dataset.nombre;
        const categoria = row.dataset.categoria;
        const coincideNombre = nombre.includes(filtroTexto);
        const coincideCategoria = filtroCategoria === 'todas' || categoria === filtroCategoria;
        row.style.display = (coincideNombre && coincideCategoria) ? '' : 'none';
      });
    }

    function agregarAlCarrito(indice) {
      const cantidad = parseFloat(document.getElementById(`cantidad-${indice}`).value);
      if (cantidad <= 0 || isNaN(cantidad)) return;
      const prod = productos[indice];
      const existente = carrito.find(p => p.nombre === prod.nombre);
      if (existente) {
        existente.cantidad += cantidad;
      } else {
        carrito.push({ ...prod, cantidad });
      }
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const contenedor = document.getElementById('itemsCarrito');
      contenedor.innerHTML = '';
      let total = 0;
      carrito.forEach((item, i) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        contenedor.innerHTML += `
          <tr>
            <td>${item.nombre}</td>
            <td>${item.cantidad}</td>
            <td>${item.precio.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
            <td>${subtotal.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
            <td><button onclick="quitarDelCarrito(${i})">Eliminar</button></td>
          </tr>`;
      });
      document.getElementById('totalCarrito').innerText = total.toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
      localStorage.setItem('carrito', JSON.stringify(carrito));
    }

    function cargarCarritoDesdeLocalStorage() {
      const data = localStorage.getItem('carrito');
      if (data) {
        const items = JSON.parse(data);
        items.forEach(item => carrito.push(item));
        actualizarCarrito();
      }
    }

    function quitarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function vaciarCarrito() {
      carrito.length = 0;
      actualizarCarrito();
      localStorage.removeItem('carrito');
      document.getElementById('factura').classList.add('hidden');
    }

    function generarFactura() {
      const mesa = document.getElementById('mesa').value;
      if (!mesa || isNaN(mesa) || mesa < 1) {
        alert('Por favor ingrese un número de mesa válido');
        return;
      }

      const factura = document.getElementById('factura');
      const detalle = document.getElementById('facturaDetalle');
      let total = 0;
      detalle.innerHTML = '';

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        detalle.innerHTML += `
          <tr>
            <td>${item.nombre}</td>
            <td>${item.cantidad}</td>
            <td>${item.precio.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
            <td>${subtotal.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
          </tr>`;
      });

      document.getElementById('facturaTotal').innerText = total.toLocaleString('es-CO', { style: 'currency', currency: 'COP' });
      document.getElementById('facturaFolio').innerText = folio;
      document.getElementById('facturaMesa').innerText = mesa;

      const ahora = new Date();
      document.getElementById('facturaFecha').innerText = ahora.toLocaleString('es-CO', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      factura.classList.remove('hidden');

      const facturaData = {
        folio: folio,
        mesa: mesa,
        fecha: ahora.toISOString(),
        items: [...carrito],
        total: total
      };

      guardarFacturaEnHistorial(facturaData);

      folio++;
      localStorage.setItem('folio', folio.toString());
    }

    function mostrarPrevisualizacion() {

      if (factura.classList.contains('hidden')) {

      const previewContent = document.getElementById('facturaPreview');

              <th>Subtotal</th>

            ${carrito.map(item => `

                <td>${item.nombre}</td>
                <td>${item.cantidad}</td>
                <td>${item.precio.toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
                <td>${(item.precio * item.cantidad).toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3"><strong>Total a Pagar</strong></td>
              <td>${document.getElementById('facturaTotal').innerText}</td>
            </tr>
          </tfoot>
        </table>
        <div class="factura-footer">
          ¡Gracias por su visita!
        </div>
      `;

      document.getElementById('previewModal').style.display = 'block';
    }

    function cerrarModal() {
      document.getElementById('previewModal').style.display = 'none';
    }

   function imprimirFactura() {
  const filas = carrito.map(item => `
    <tr>
      <td>${item.cantidad}</td>
      <td>${item.nombre}</td>
      <td>${(item.precio * item.cantidad).toLocaleString('es-CO', { style: 'currency', currency: 'COP' })}</td>
    </tr>
  `).join('');

  const facturaHTML = `
    <div class="factura">
      <div class="encabezado">
        <h2>IL CAFETO</h2>
        <h3>Factura</h3>
        <p>Folio: ${document.getElementById('facturaFolio').innerText}</p>
        <p>Mesa: ${document.getElementById('facturaMesa').innerText}</p>

    function exportarPDF() {
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: [80, 210] // Tamaño para impresora de rollos (80mm de ancho)
      });
      
      // Configuración para papel de factura
      pdf.setFont('courier');
      pdf.setFontSize(10);
      
      // Encabezado
      pdf.text('IL CAFETO', 40, 10, { align: 'center' });
      pdf.text('Factura', 40, 15, { align: 'center' });
      pdf.text(`Folio: ${document.getElementById('facturaFolio').innerText}`, 5, 20);
      pdf.text(`Mesa: ${document.getElementById('facturaMesa').innerText}`, 5, 25);
      pdf.text(`Fecha: ${document.getElementById('facturaFecha').innerText}`, 5, 30);
      
      pdf.line(5, 35, 75, 35);
      
      // Detalles de la factura
      pdf.text('Producto', 5, 40);
      pdf.text('Cant.', 40, 40);
      pdf.text('Precio', 55, 40);
      pdf.text('Subtotal', 70, 40);
      
      let y = 45;
      carrito.forEach(item => {
        // Si necesitamos una nueva página
        if (y > 180) {
          pdf.addPage();
          y = 15;
        }
        
        pdf.text(item.nombre.substring(0, 20), 5, y);
        pdf.text(item.cantidad.toString(), 40, y);
        pdf.text(item.precio.toLocaleString('es-CO', { style: 'currency', currency: 'COP' }), 55, y);
        pdf.text((item.precio * item.cantidad).toLocaleString('es-CO', { style: 'currency', currency: 'COP' }), 70, y);
        y += 5;
      });
      
      pdf.line(5, y, 75, y);
      y += 5;
      
      // Total
      pdf.setFontSize(12);
      pdf.text('Total:', 55, y);
      pdf.text(document.getElementById('facturaTotal').innerText, 70, y);
      y += 10;
      
      // Pie de página
      pdf.setFontSize(8);
      pdf.text('¡MUCHAS GRACIAS POR SU VISITA!', 40, y, { align: 'center' });
      
      // Descargar el PDF
      pdf.save(`factura_mesa_${document.getElementById('facturaMesa').innerText}.pdf`);
    }

    function exportarFacturasCSV() {
      const historial = JSON.parse(localStorage.getItem('historialFacturas') || '[]');
      if (historial.length === 0) {
        alert('No hay facturas para exportar');
        return;
      }

      let csv = 'Folio,Mesa,Fecha,Producto,Cantidad,Precio Unitario,Subtotal,Total\n';

      historial.forEach(factura => {
        factura.items.forEach(item => {
          csv += `${factura.folio},${factura.mesa},"${factura.fecha}",${item.nombre},${item.cantidad},${item.precio},${item.precio * item.cantidad},${factura.total}\n`;
        });
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `facturas_il_cafeto_${new Date().toISOString().slice(0, 10)}.csv`;
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function borrarHistorial() {
      if (confirm("¿Estás seguro de que deseas borrar el historial de facturas? Esta acción no se puede deshacer.")) {
        localStorage.removeItem('historialFacturas');
        alert("Historial borrado correctamente.");
      }
    }

    // Cerrar el modal si se hace clic fuera del contenido
    window.onclick = function(event) {
      const modal = document.getElementById('previewModal');
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

      mostrarProductos();
      cargarCarritoDesdeLocalStorage();
    };
